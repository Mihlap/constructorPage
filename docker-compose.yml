services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagebuilder
      POSTGRES_PASSWORD: pagebuilder
      POSTGRES_DB: pagebuilder
    ports:
      - "5432:5432"
    volumes:
      - pagebuilder_pgdata:/var/lib/postgresql/data

volumes:
  pagebuilder_pgdata:
